# Local stack: Postgres 18 + the read-only API, plus a `pipeline` container for the
# load/transform/removal scripts. See DOCKER.md.
#
#   docker compose up -d                       # db + api (http://localhost:8000)
#   docker compose run --rm pipeline python3 load_registry_pg.py /data/20261007_DATA-CURRENT.zip
#
# Registry zips go in ./data (gitignored), which is mounted at /data.

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: sor
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql
      # Runs once, on an empty volume: creates the `cleaned` schema.
      - ./docs/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      # 5433 on the host so it doesn't collide with a Homebrew Postgres on 5432.
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d sor"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/sor
      API_KEY: ${API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  # One-off runner for the pipeline scripts; not started by `docker compose up`.
  pipeline:
    build:
      context: .
      dockerfile: docker/pipeline.Dockerfile
    profiles: ["tools"]
    environment:
      # The scripts fall back to psql's PG* variables when no connection is given.
      PGHOST: db
      PGDATABASE: sor
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - .:/app
      - ./data:/data
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
